name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-soup-3.0 libglib2.0-dev-bin meson ninja-build python3
      - name: Verify JavaScript, schemas, fixtures, and package
        run: npm run verify
      - name: Verify isolated install
        run: |
          meson setup build --prefix="$RUNNER_TEMP/freeby-install"
          meson install -C build
          test -f "$RUNNER_TEMP/freeby-install/share/gnome-shell/extensions/freeby@kelvin.local/schemas/gschemas.compiled"
      - uses: actions/upload-artifact@v4
        with:
          name: freeby-extension
          path: dist/*.zip
